packages:
  - "apps/*"
  - "packages/*"

# Default catalog: every dependency declared by two or more workspace packages.
# Packages reference it as `"name": "catalog:"`; change a version here, once.
# A dependency used by a single package keeps its literal range in that package.
# Peer ranges stay literal (a catalog would force the exact range on consumers).
# `pnpm check:workspace` (sherif + scripts/check-catalog.mjs) fails on drift.
catalog:
  "@better-auth/api-key": "1.7.5"
  "@fontsource-variable/geist": "^5.3.0"
  "@fontsource-variable/geist-mono": "^5.3.0"
  "@orpc/contract": "^1.15.1"
  "@orpc/openapi": "^1.15.1"
  "@orpc/server": "^1.15.1"
  "@orpc/zod": "^1.15.1"
  "@tailwindcss/vite": "^4.3.3"
  "@types/node": "^26.5.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": "^6.1.1"
  better-auth: "1.7.5"
  cn: "0.3.2"
  date-fns: "^4.4.0"
  dotenv: "^17.4.2"
  drizzle-orm: "^0.45.2"
  effect: "4.0.0"
  evlog: "2.29.0"
  lucide-react: "^1.46.0"
  oxlint: "1.82.0"
  react: "^19.3.0"
  react-dom: "^19.3.0"
  tailwindcss: "^4.3.3"
  tsx: "^4.23.13"
  typescript: "7.0.2"
  vitest: "^5.0.1"
  zod: "^4.6.5"

# Every override below forces ONE version across the whole dependency graph,
# including third-party dependencies we do not declare. Each states why and
# when to revisit it. Single-sourced versions use `catalog:` so the override
# and the direct declarations cannot drift apart again.
overrides:
  # Run one oxlint binary. react-doctor depends on its own oxlint (1.79.0 at
  # 0.9.13), and `effect-tsgo patch --oxlint` (the root `prepare` script)
  # patches the oxlint that ultracite and `pnpm check` run; a second copy would
  # lint differently (and unpatched) from the root one. History: pinned to
  # 1.81.0 on 2026-09-04 together with typescript/effect/oxlint-tsgolint and
  # left behind when Dependabot moved the root to 1.82.0; now both read the
  # catalog. Revisit when react-doctor drops its oxlint dependency.
  oxlint: "catalog:"
  # shadcn -> @modelcontextprotocol/sdk depends on `zod ^3.25 || ^4`; without
  # this pnpm adds a zod 3.25.76 copy next to zod 4. Keeps a single zod 4 in
  # the graph (zod 3 and 4 schemas do not mix in @orpc/zod or Better Auth).
  # Revisit when shadcn / the MCP SDK drop their zod 3 resolution.
  zod: "catalog:"
  # GHSA-x5fp-wj9c-mxmx (qs <= 6.15.3, array-limit bypass) and GHSA-4mjr-xmp4-gh2g
  # (qs < 6.16.0, DoS via isBuffer): express and body-parser (shadcn ->
  # @modelcontextprotocol/sdk, evlog) only require ^6.14.0 / ^6.15.2, so an old
  # lockfile could keep a vulnerable qs. A floor, not a pin. Revisit (remove)
  # when express and body-parser require qs ^6.16.0.
  qs: ">=6.16.0"
  # @effect/platform-node-shared 4.0.0 pins ws 8.22.0 while happy-dom pins
  # 8.21.3; two ws copies split every @orpc/server peer variant (crossws/ws) and
  # break the web handler plugin types. Keeps a single ws. Revisit when
  # happy-dom moves to ws 8.22.0 or later.
  ws: "8.22.0"
  # devalue: GHSA-x5rw-q4pp-hg5g, GHSA-mcm9-63f2-9j32, GHSA-j22f-vq7h-c4qm and
  # three more (fixed in 5.9.3). astro only asks for ^5.8.1, so an old lockfile
  # keeps a vulnerable copy. Bounded to the current major, so a floor within it. Revisit (remove) when astro
  # requires devalue ^5.9.3.
  devalue: "^5.9.3"
  # ip-address: GHSA-h3mg-xc3c-68pw, GHSA-j6r3-76f7-8jcv (fixed in 10.7.1);
  # reached through shadcn -> @modelcontextprotocol/sdk -> express-rate-limit.
  # Bounded to the current major. Revisit when those require ^10.7.1.
  ip-address: "^10.7.1"
  # brace-expansion: GHSA-q2hr-2g5m-vwhr (quadratic expansion; fixed in 5.0.12);
  # reached through minimatch (eslint, ts-morph). Revisit when
  # minimatch requires ^5.0.12. Bounded to the current major.
  brace-expansion: "^5.0.12"

allowBuilds:
  esbuild: true
  lightningcss: true
  msgpackr-extract: false
  msw: true
  sharp: false

minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.39.1"
  - "@effect/tsgo-darwin-x64@0.39.1"
  - "@effect/tsgo-linux-arm64@0.39.1"
  - "@effect/tsgo-linux-arm@0.39.1"
  - "@effect/tsgo-linux-x64@0.39.1"
  - "@effect/tsgo-win32-arm64@0.39.1"
  - "@effect/tsgo-win32-x64@0.39.1"
  - "@effect/tsgo@0.39.1"
  - "@better-auth-ui/core@1.7.23"
  - "@better-auth-ui/react@1.7.23"
