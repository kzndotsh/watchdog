packages:
  - "apps/*"
  - "packages/*"

# Default catalog: every dependency declared by two or more workspace packages.
# Packages reference it as `"name": "catalog:"`; change a version here, once.
# A dependency used by a single package keeps its literal range in that package.
# Peer ranges stay literal (a catalog would force the exact range on consumers).
catalog:
  "@better-auth/api-key": "1.7.5"
  "@fontsource-variable/geist": "^5.3.0"
  "@fontsource-variable/geist-mono": "^5.3.0"
  "@orpc/contract": "^1.15.1"
  "@orpc/openapi": "^1.15.1"
  "@orpc/server": "^1.15.1"
  "@orpc/zod": "^1.15.1"
  "@tailwindcss/vite": "^4.3.3"
  "@types/node": "^26.5.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": "^6.1.1"
  better-auth: "1.7.5"
  cn: "0.3.2"
  date-fns: "^4.4.0"
  dotenv: "^17.4.2"
  drizzle-orm: "^0.45.2"
  effect: "4.0.0-rc.115"
  evlog: "2.29.0"
  lucide-react: "^1.46.0"
  react: "^19.3.0"
  react-dom: "^19.3.0"
  tailwindcss: "^4.3.3"
  tsx: "^4.23.13"
  typescript: "7.0.2"
  vitest: "^5.0.1"
  zod: "^4.6.5"

overrides:
  typescript: "7.0.2"
  "react-doctor>typescript": "5.9.3"
  effect: "4.0.0-rc.115"
  oxlint: "1.81.0"
  oxlint-tsgolint: "7.0.2001"
  zod: "^4.4.3"
  better-auth: "1.7.5"
  "@better-auth/core": "1.7.5"
  # GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g (express → body-parser transitive)
  qs: "6.16.0"

allowBuilds:
  esbuild: true
  lightningcss: true
  msgpackr-extract: false
  msw: true
  sharp: false

minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.39.1"
  - "@effect/tsgo-darwin-x64@0.39.1"
  - "@effect/tsgo-linux-arm64@0.39.1"
  - "@effect/tsgo-linux-arm@0.39.1"
  - "@effect/tsgo-linux-x64@0.39.1"
  - "@effect/tsgo-win32-arm64@0.39.1"
  - "@effect/tsgo-win32-x64@0.39.1"
  - "@effect/tsgo@0.39.1"
  - "@better-auth-ui/core@1.7.23"
  - "@better-auth-ui/react@1.7.23"
