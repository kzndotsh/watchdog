---
# Codecov — coverage is a reviewer signal, not a merge gate.
# Docs: https://docs.codecov.com/docs/codecov-yaml
# Validate: https://api.codecov.io/validate

codecov:
  require_ci_to_pass: true
  # yamllint disable-line rule:truthy
  max_report_age: false
  disable_default_path_fixes: false

coverage:
  precision: 2
  round: down
  range: 50...100

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
        only_pulls: true
        if_not_found: success
        if_ci_failed: error

# Two uploads: `unit` (unit, web-unit, property, component, e2e-parser) and `integration` (real
# Postgres and S3). Codecov merges them. Path filters can skip either job on a pull request, so a
# missing flag carries its last result forward instead of reading as a coverage drop.
flag_management:
  default_rules:
    carryforward: true

comment:
  layout: condensed_header, diff, condensed_files, condensed_footer
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
  after_n_builds: 1

github_checks:
  annotations: true

ignore:
  - "**/__tests__/**"
  - e2e/
  - "**/*.gen.ts"
  - "**/generated/**"
  - "**/drizzle/**"
  - docs/
  - scripts/
  # Vendored shadcn primitives (packages/ui, generated and locked by ui:sync): not our code to cover.
  - packages/ui/src/components/
  - packages/ui/src/hooks/
  - apps/site/
  - "*.md"
  - "*.yml"
  - "*.yaml"
  - "*.json"
  - "*.toml"
  - "*.lock"
  - "*.nix"
