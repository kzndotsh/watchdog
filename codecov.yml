---
# Codecov — coverage is a reviewer signal, not a merge gate.
# Docs: https://docs.codecov.com/docs/codecov-yaml
# Validate: https://api.codecov.io/validate

codecov:
  require_ci_to_pass: true
  # yamllint disable-line rule:truthy
  max_report_age: false
  disable_default_path_fixes: false

coverage:
  precision: 2
  round: down
  range: 50...100

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
        only_pulls: true
        if_not_found: success
        if_ci_failed: error

comment:
  layout: condensed_header, diff, condensed_files, condensed_footer
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
  after_n_builds: 1

github_checks:
  annotations: true

ignore:
  - "**/__tests__/**"
  - e2e/
  - "_legacy-*/**"
  - "**/*.gen.ts"
  - "**/generated/**"
  - "**/drizzle/**"
  - docs/
  - scripts/
  - apps/site/
  - "*.md"
  - "*.yml"
  - "*.yaml"
  - "*.json"
  - "*.toml"
  - "*.lock"
  - "*.nix"
