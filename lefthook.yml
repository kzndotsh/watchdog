# Local git hooks — fast checks only. CI remains the merge gate (tests, knip, e2e, drift).
# Install: automatic in `nix develop` (see flake.nix). Manual: `lefthook install`
# Overrides: lefthook-local.yml (gitignored) — e.g. skip slow commands locally

min_version: 1.10.0

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    ultracite:
      glob:
        - "*.{ts,tsx,js,json,yml,yaml,md}"
        - "**/*.{ts,tsx,js,json,yml,yaml,md}"
      exclude:
        - "**/routeTree.gen.ts"
        - "packages/client/src/generated/**"
        - "packages/caps/capabilities.gen.json"
        - "packages/ui/src/components/**"
        - "packages/ui/src/hooks/**"
        # Root-level e2e files lose type-aware context when linted by path (see ultracite-scripts).
        - "e2e/**"
        # Formatter-ignored trees (oxfmt.config.ts / .prettierignore): if every staged file is ignored,
        # ultracite exits 2 ("Expected at least one target file") and blocks the commit.
        - ".agents/**"
        - ".cursor/**"
        - ".claude/**"
        - ".kiro/**"
        - "GLOSSARY.md"
        - "packages/db/drizzle/**"
      # Staged files only: a repo-wide fix rewrites files outside the commit
      # and can break lefthook's restore of unstaged changes.
      run: pnpm exec ultracite fix --disable-nested-config --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    ultracite-scripts:
      # .mjs scripts lose type-aware context when linted by path, so check the
      # whole repo instead. Read-only: never rewrites files, so it can't break
      # the unstaged-changes restore either.
      glob:
        - "*.mjs"
        - "**/*.mjs"
        - "e2e/**/*.ts"
      run: pnpm check
    agents:
      glob:
        - "{AGENTS.md,**/AGENTS.md}"
        - "CLAUDE.md"
        - "scripts/check-agents.mjs"
      run: pnpm check:agents:strict
    docs:
      glob:
        - "docs/**"
        - "scripts/check-docs.mjs"
        - "scripts/doc-map.mjs"
        - "scripts/check-docs-affected.mjs"
        - "scripts/lib/**"
      run: pnpm check:docs:strict
    design-tokens:
      glob:
        - "DESIGN.md"
        - "apps/web/src/styles/wd-*.css"
        - "scripts/check-design-tokens.mjs"
      run: pnpm check:design-tokens
    effect-edges:
      glob:
        - "packages/**/*.ts"
        - "apps/**/*.ts"
        - "apps/**/*.tsx"
        - "scripts/check-effect-edges.mjs"
      exclude:
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.test.tsx"
      run: pnpm check:effect-edges:strict
    tagged-errors:
      glob:
        - "packages/**/*.ts"
        - "apps/**/*.ts"
        - "apps/**/*.tsx"
        - "scripts/check-tagged-errors.mjs"
      exclude:
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.test.tsx"
      run: pnpm check:tagged-errors:strict
    workspace-reexports:
      glob:
        - "packages/**/*.ts"
        - "packages/**/*.tsx"
        - "apps/**/*.ts"
        - "apps/**/*.tsx"
        - "scripts/check-workspace-reexports.mjs"
      exclude:
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.test.tsx"
      run: pnpm check:workspace-reexports
    vendor-lock:
      glob:
        - "packages/ui/src/components/**"
        - "packages/ui/src/hooks/**"
        - "packages/ui/vendor.json"
        - "scripts/ui-vendor.mjs"
      run: pnpm check:vendor
    size-budget:
      glob:
        - "apps/*/src/**/*.{ts,tsx}"
        - "packages/*/src/**/*.{ts,tsx}"
        - "scripts/check-size-budget.mjs"
        - "scripts/size-budget-baseline.json"
      run: pnpm check:size
    action-pins:
      glob:
        - ".github/workflows/**"
        - "scripts/check-action-pins.mjs"
      run: pnpm check:action-pins
    workspace:
      # sherif (mismatched versions, misplaced dependency types) + catalog use.
      glob:
        - "**/package.json"
        - "pnpm-workspace.yaml"
        - "scripts/check-catalog.mjs"
      run: pnpm check:workspace
    migrations:
      # Schema edits must ship their migration; generate must be a no-op.
      glob:
        - "packages/db/src/schema/**"
        - "packages/schemas/**"
        - "packages/db/drizzle/**"
        - "packages/db/drizzle.config.ts"
        - "scripts/check-migrations.mjs"
      run: pnpm check:migrations
    boundaries:
      # Source imports, manifests and the exports maps they are checked against.
      glob:
        - "apps/**/*.{ts,tsx,js,mjs}"
        - "packages/**/*.{ts,tsx,js,mjs}"
        - "**/package.json"
        - "pnpm-workspace.yaml"
        - "scripts/check-boundaries.mjs"
      run: pnpm check:boundaries
    codeowners:
      # Also depends on which files exist (a rename can orphan a pattern), so CI reruns it on every change.
      glob:
        - ".github/CODEOWNERS"
        - "scripts/check-codeowners.mjs"
      run: pnpm check:codeowners
    agent-skills:
      glob:
        - "**/.agents/skills/**"
        - "scripts/validate-agents.mjs"
        - "scripts/lib/**"
        - ".cursor/README.md"
      run: pnpm validate:agents --staged

commit-msg:
  skip:
    - merge
    - rebase
  commands:
    # Runs here (not pre-commit) so it can read the real message file {1}.
    docs-affect:
      run: pnpm check:docs-affected:strict {1}

pre-push:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    typecheck:
      run: pnpm typecheck
    gate-tests:
      glob:
        - "scripts/**"
        - "packages/db/scripts/**"
        - "lefthook.yml"
        - ".github/workflows/**"
        - "skills-lock.json"
        - "vitest.config.ts"
      run: pnpm test:gate
