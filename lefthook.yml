# Local git hooks. Pre-commit only formats the staged files; lint and every other gate run in
# `pnpm verify` (the agent stop hook runs it) and in CI (`pnpm verify --full`), the merge gate.
# Install: automatic in `nix develop` (see flake.nix) and by `pnpm install` (the `prepare` script). Manual: `pnpm exec lefthook install`
# Overrides: lefthook-local.yml (gitignored) — e.g. skip slow commands locally

min_version: 1.10.0

pre-commit:
  skip:
    - merge
    - rebase
  commands:
    format:
      glob:
        - "*.{ts,tsx,js,mjs,json,yml,yaml,md}"
        - "**/*.{ts,tsx,js,mjs,json,yml,yaml,md}"
      # Staged files only: a repo-wide format rewrites files outside the commit and can break
      # lefthook's restore of unstaged changes. Files the formatter ignores (oxfmt.config.ts:
      # generated output, vendored UI, `.agents/`, `.claude/`, `docs/glossary.md`) are skipped,
      # and a commit of only those passes (`--no-error-on-unmatched-pattern`).
      run: pnpm exec oxfmt --disable-nested-config --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    typecheck:
      # Skipped when the push touches no code: docs, skills and workflow YAML cannot change
      # a type error. Code is TS/JS sources, JSON (tsconfigs, package.json, JSON imports),
      # Astro components and the pnpm lock/workspace files. Every other pre-push command
      # still runs.
      glob:
        - "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,astro}"
        - "**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,astro}"
        - "pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
      run: pnpm typecheck
    gate-tests:
      glob:
        - "scripts/**"
        - "packages/db/scripts/**"
        - "lefthook.yml"
        - ".github/workflows/**"
        - "skills-lock.json"
        - "vitest.config.ts"
      run: pnpm test:gate
