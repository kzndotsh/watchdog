# Greenfield Day-0 — Postgres + S3-compatible storage (SeaweedFS). No Redis until earned.
#
# Ports are loopback-bound. If mid-build `watchdog-postgres` already owns :5432,
# either stop it or point DATABASE_URL at that instance + a dedicated DB
# (see env.example).

services:
  postgres:
    # PG 18+ Docker images mount the volume at /var/lib/postgresql (not .../data).
    # Existing 16 volumes are incompatible — recreate: `just down && docker volume rm watchdog_postgres_data` (name may vary) then `just up`.
    image: postgres:18-alpine
    container_name: watchdog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: watchdog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./docker/postgres/01_test_dbs.sh:/docker-entrypoint-initdb.d/01_test_dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watchdog"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    # SeaweedFS in single-node `mini` mode (master + volume + filer + S3 gateway in one process).
    # Upstream MinIO is archived and no longer published; see docs/how-to/local-dev.md.
    image: chrislusf/seaweedfs:4.48
    container_name: watchdog-s3
    restart: unless-stopped
    environment:
      # SeaweedFS reads its admin S3 identity from the standard AWS variables.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    # Host 9100 — :8333 is SeaweedFS's S3 port inside the container
    ports:
      - "127.0.0.1:9100:8333"
    command: mini -dir=/data
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  s3_data:
