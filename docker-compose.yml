# Greenfield Day-0 — Postgres + MinIO. No Redis until earned.
#
# Ports are loopback-bound. If mid-build `watchdog-postgres` already owns :5432,
# either stop it or point DATABASE_URL at that instance + a dedicated DB
# (see env.example).

services:
  postgres:
    # PG 18+ Docker images mount the volume at /var/lib/postgresql (not .../data).
    # Existing 16 volumes are incompatible — recreate: `just down && docker volume rm watchdog_postgres_data` (name may vary) then `just up`.
    image: postgres:18-alpine
    container_name: watchdog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: watchdog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./docker/postgres/01_test_dbs.sh:/docker-entrypoint-initdb.d/01_test_dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watchdog"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Upstream `minio/minio` (Hub and Quay) is no longer pullable. coollabsio builds MinIO from
    # source and ships `mc` and bash, which the healthcheck and scripts/minio-init.sh use.
    image: ghcr.io/coollabsio/minio:latest
    container_name: watchdog-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    # Host 9100/9101 — :9000 often taken
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # No curl in the image: speak HTTP over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /minio/health/live HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -r line <&3; [[ "$$line" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
