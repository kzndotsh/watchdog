# Watchdog CI — change-aware parallel jobs, fail-fast gates.
# Docs-only PRs skip heavy jobs; push to main always runs full CI.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    # ready_for_review is not a default type: without it a PR opened as a draft
    # (jobs are skipped while draft) never gets CI after it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Only a pull request supersedes its own earlier run. A push to main gets its own group
# (the SHA) and is never cancelled, so every commit on main ends with a verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; a job that needs more declares it under its own `permissions`.
permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: test-secret-must-be-at-least-32-chars
  BETTER_AUTH_URL: http://127.0.0.1:3000
  BETTER_AUTH_ALLOW_SIGNUP: "1"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/watchdog
  S3_ENDPOINT: http://127.0.0.1:9100
  S3_ACCESS_KEY: watchdog
  S3_SECRET_KEY: watchdog-dev-secret
  S3_BUCKET: watchdog-evidence
  S3_REGION: us-east-1
  WD_MASTER_VAULT_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

jobs:
  changes:
    name: File detection
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      config: ${{ steps.filter.outputs.config }}
      config_core: ${{ steps.filter.outputs.config_core }}
      integration_scripts: ${{ steps.filter.outputs.integration_scripts }}
      typescript_app: ${{ steps.app.outputs.typescript_app }}
      caps: ${{ steps.filter.outputs.caps }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      site: ${{ steps.filter.outputs.site }}
      db: ${{ steps.filter.outputs.db }}
      e2e: ${{ steps.filter.outputs.e2e }}
      bundle_scripts: ${{ steps.filter.outputs.bundle_scripts }}
      container: ${{ steps.filter.outputs.container }}
      agents: ${{ steps.filter.outputs.agents }}
      docs: ${{ steps.filter.outputs.docs }}
      design: ${{ steps.filter.outputs.design }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.json'
              - '**/*.yml'
              - '**/*.yaml'
              - '**/*.sql'
              - '**/*.sh'
              - '**/*.mjs'
              - '**/*.js'
            typescript:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/tsconfig*.json'
            # Tooling files shared by every job. `config` adds scripts/** (Gates and Gate
            # tests run the gate scripts and their tests); `config_core` does not, so a
            # scripts-only change does not start Integration or Playwright e2e.
            config_core: &config_core
              - 'packages/ui/vendor.json'
              # Any workspace manifest (root, apps/*, packages/*): a dependency, script or
              # export edit there changes what every dependent job installs and runs.
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
              - 'knip.ts'
              - 'oxlint.config.ts'
              - 'oxfmt.config.ts'
              - 'tsconfig.json'
              - 'codecov.yml'
              - '.github/**'
              - 'docker-compose.yml'
            config:
              - *config_core
              - 'scripts/**'
            # Scripts the Integration and Playwright e2e jobs run (pnpm test-db, S3 bootstrap).
            integration_scripts:
              - 'scripts/ensure-test-db.sh'
              - 'scripts/ensure-readonly-role.sh'
              - 'scripts/s3-init.sh'
            # The bundle gate and its baseline: the Web build job runs them.
            bundle_scripts:
              - 'scripts/check-bundle-budget.mjs'
              - 'scripts/bundle-budget-baseline.json'
            # What the images are built from or run with, beyond `config_core` (manifests,
            # lockfile, .github/**): the image definition, the entrypoint and smoke script, the
            # production compose file and everything the web and worker bundles are built from.
            container:
              - 'Dockerfile'
              - '.dockerignore'
              - '.trivyignore'
              - 'docker/**'
              - 'docker-compose.prod.yml'
              - 'env.production.example'
              - 'scripts/s3-init.sh'
              - 'apps/web/**'
              - 'apps/worker/**'
              - 'packages/**'
            caps:
              - 'packages/caps/**'
            api:
              - 'packages/api/**'
              - 'packages/client/**'
              - 'packages/core/**'
            web:
              - 'apps/web/**'
            site:
              - 'apps/site/**'
            db:
              - 'packages/db/**'
              # db schema files import from @watchdog/schemas.
              - 'packages/schemas/**'
            e2e:
              - 'e2e/**'
              - 'playwright.config.ts'
            agents:
              - '**/AGENTS.md'
              - 'scripts/check-agents.mjs'
              - '**/.agents/skills/**'
              - 'scripts/validate-agents.mjs'
              - '.cursor/README.md'
            # DESIGN.md is checked in Gates (lint:design, check:design-tokens) and is not under docs/.
            design:
              - 'DESIGN.md'
            docs:
              - 'docs/**'
              - 'docs/reference/web/**'
              - '**/*.md'
              - 'scripts/check-docs.mjs'
              - 'scripts/doc-map.mjs'
              - 'scripts/check-docs-affected.mjs'

      # `some-with-excludes` lets a filter carry a `!` pattern: the default `some`
      # quantifier ignores negations. Same patterns as `typescript`, minus scripts/**.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: app
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            typescript_app:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/tsconfig*.json'
              - '!scripts/**'

  gates:
    name: Gates
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.db == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.caps == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.typescript_app == 'true' ||
      needs.changes.outputs.config == 'true' ||
      needs.changes.outputs.config_core == 'true' || needs.changes.outputs.integration_scripts == 'true' ||
      needs.changes.outputs.design == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Ultracite (Oxlint + Oxfmt)
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check

      - name: AGENTS.md hygiene
        if: github.event_name != 'pull_request' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:agents:strict

      - name: Docs links and index
        if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:docs:strict

      - name: Docs affect (strict map)
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.config == 'true'
        env:
          DOCS_AFFECT_BEFORE: ${{ github.event.before }}
          DOCS_AFFECT_AFTER: ${{ github.event.after }}
        run: pnpm check:docs-affected:strict

      - name: Tagged error names and codes
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:tagged-errors:strict

      - name: Workspace re-exports
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:workspace-reexports

      - name: Vendored UI lock
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:vendor

      - name: File-size budget
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:size

      - name: Agent Skills validation
        if: github.event_name != 'pull_request' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.config == 'true'
        env:
          # Staleness is diff-based: PR range, or the pushed before/after pair
          # (the gate resolves an all-zero before SHA to the merge base with main).
          DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || '' }}
          DIFF_BEFORE: ${{ github.event.before }}
          DIFF_AFTER: ${{ github.sha }}
        run: |
          if [ -n "$DIFF_RANGE" ]; then
            pnpm validate:agents --range="$DIFF_RANGE"
          else
            pnpm validate:agents --before="$DIFF_BEFORE" --after="$DIFF_AFTER"
          fi

      - name: Action SHA pins
        if: github.event_name != 'pull_request' || needs.changes.outputs.config == 'true'
        run: pnpm check:action-pins

      - name: Workspace consistency
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:workspace

      - name: Package boundaries
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:boundaries

      - name: CODEOWNERS paths
        run: pnpm check:codeowners

      - name: DESIGN.md format (official linter)
        run: pnpm lint:design

      - name: DESIGN.md tokens match the CSS
        run: pnpm check:design-tokens

      - name: Dependency licenses
        run: pnpm check:licenses

      - name: Third-party notices
        run: pnpm check:notices

      - name: Env example and configuration reference
        run: pnpm check:env

      - name: Typecheck
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm typecheck

      - name: Knip (unused files / exports / deps)
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm knip

      - name: Site build
        if: github.event_name != 'pull_request' || needs.changes.outputs.site == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm --filter @watchdog/site build

      - name: CapDescriptor drift
        if: github.event_name != 'pull_request' || needs.changes.outputs.caps == 'true' || needs.changes.outputs.config == 'true'
        run: |
          pnpm generate:caps
          git diff --exit-code -- packages/caps/capabilities.gen.json \
            || (echo "capabilities.gen.json out of date — run pnpm generate:caps" && exit 1)

      - name: OpenAPI client contract drift
        if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true' || needs.changes.outputs.config == 'true'
        run: |
          pnpm generate:client
          git diff --exit-code -- packages/client/src/generated/ \
            || (echo "client contract out of date — run pnpm generate:client" && exit 1)

      - name: Migration drift
        if: github.event_name != 'pull_request' || needs.changes.outputs.db == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:migrations

  unit-component:
    name: Unit, property and component tests
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # lcov.info is the only report anything reads (Codecov below); text and html would
      # only cost time. The gate project is not part of this run (see the Gate tests job).
      - name: Unit + property + component + e2e-parser coverage
        run: >
          pnpm run test:coverage -- --coverage.reporter=lcovonly --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          name: watchdog
          fail_ci_if_error: false
          verbose: true
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          file: junit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The gate project runs the gate scripts as child processes, so v8 sees no covered code in
  # it: no coverage here. Its own job keeps the 4-core runner off the unit-component job's critical path.
  gate-tests:
    name: Gate tests
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gate tests
        run: >
          pnpm run test:gate -- --reporter=default --reporter=junit --outputFile.junit=junit-gate.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          file: junit-gate.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Integration tests and Playwright run as two parallel jobs, each with its own Postgres
  # service and S3 container (a job is its own runner). Both feed the `check` aggregate and
  # keep the trigger set of the old combined job: neither is narrowed.
  integration:
    name: Integration
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.db == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.caps == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.typescript_app == 'true' ||
      needs.changes.outputs.config_core == 'true' || needs.changes.outputs.integration_scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: watchdog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watchdog" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install psql
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Test databases + migrate
        env:
          DATABASE_URL_MIGRATE: postgresql://postgres:postgres@127.0.0.1:5432/watchdog
        run: pnpm test-db

      - name: Start S3 (SeaweedFS)
        run: |
          docker run -d --name s3 \
            -p 9100:8333 \
            -e AWS_ACCESS_KEY_ID=watchdog \
            -e AWS_SECRET_ACCESS_KEY=watchdog-dev-secret \
            chrislusf/seaweedfs:4.48 mini -dir=/data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9100/healthz && exit 0
            sleep 2
          done
          echo "S3 server failed to become healthy" >&2
          docker logs s3
          exit 1

      - name: Create evidence bucket
        run: bash scripts/s3-init.sh

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://watchdog_app:watchdog@127.0.0.1:5432/watchdog_test
          DATABASE_URL_MIGRATE: postgresql://postgres:postgres@127.0.0.1:5432/watchdog_test
        run: pnpm test:integration

  e2e:
    name: Playwright e2e
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.db == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.caps == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.typescript_app == 'true' ||
      needs.changes.outputs.config_core == 'true' || needs.changes.outputs.integration_scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: watchdog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watchdog" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install psql
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Test databases + migrate
        env:
          DATABASE_URL_MIGRATE: postgresql://postgres:postgres@127.0.0.1:5432/watchdog
        run: pnpm test-db

      - name: Start S3 (SeaweedFS)
        run: |
          docker run -d --name s3 \
            -p 9100:8333 \
            -e AWS_ACCESS_KEY_ID=watchdog \
            -e AWS_SECRET_ACCESS_KEY=watchdog-dev-secret \
            chrislusf/seaweedfs:4.48 mini -dir=/data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9100/healthz && exit 0
            sleep 2
          done
          echo "S3 server failed to become healthy" >&2
          docker logs s3
          exit 1

      - name: Create evidence bucket
        run: bash scripts/s3-init.sh

      # Keyed on the installed Playwright version: the browser build only changes with it.
      - name: Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Playwright e2e
        env:
          DATABASE_URL: postgresql://watchdog_app:watchdog@127.0.0.1:5432/watchdog_e2e
          DATABASE_URL_MIGRATE: postgresql://postgres:postgres@127.0.0.1:5432/watchdog_e2e
          CI: "true"
        run: pnpm test:e2e

      # Timing data for every run, green or red: the JSON report is how slow specs get found.
      - name: Upload Playwright JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-json
          path: test-results/results.json
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # Production build of the web app plus the bundle-size gate. Off the critical path: it needs
  # only File detection and runs beside Gates, the unit-component job and the DB jobs (all of them take longer),
  # so `Check` still waits only for the slowest job. Dev and the Playwright run use `vite dev`,
  # so this is the only place a production-only build break shows.
  web-build:
    name: Web build
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.typescript_app == 'true' ||
      needs.changes.outputs.config_core == 'true' ||
      needs.changes.outputs.bundle_scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Bundle budget
        run: pnpm check:bundle

  # The container image: build both targets, scan them, then run them against a real Postgres
  # and object store. Off the critical path like Web build: it needs File detection only. The
  # layer cache (type=gha) holds the pnpm store and the build stage, so a run that changed only
  # app code skips the dependency fetch. Read-only token: nothing is pushed anywhere (publishing
  # the images is the release job's work).
  container:
    name: Container image
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.container == 'true' ||
      needs.changes.outputs.config_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: watchdog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watchdog" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          provenance: false
          tags: watchdog-web:ci
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container

      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          load: true
          provenance: false
          tags: watchdog-worker:ci
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container

      # High and critical findings with a fix available fail the job. .trivyignore lists the
      # reviewed exceptions, each with a reason. Unfixed findings are not actionable until the
      # base image or a dependency ships a fix, so they do not fail it.
      - name: Scan web image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: watchdog-web:ci
          version: v0.75.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Scan worker image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: watchdog-worker:ci
          version: v0.75.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true

      - name: Start S3 (SeaweedFS)
        run: |
          docker run -d --name s3 \
            -p 9100:8333 \
            -e AWS_ACCESS_KEY_ID=watchdog \
            -e AWS_SECRET_ACCESS_KEY=watchdog-smoke-secret \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d mini -dir=/data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9100/healthz && exit 0
            sleep 2
          done
          echo "S3 server failed to become healthy" >&2
          docker logs s3
          exit 1

      # Two web replicas migrate an empty database at once, readiness and the sign-in page,
      # the worker, and a deliberately failing migration that must stop the container. The
      # database URL is the owner's; the script creates the application role (watchdog_app) and
      # runs web and worker as it, then asserts the role cannot alter, drop or truncate tables.
      - name: Smoke test
        env:
          WEB_IMAGE: watchdog-web:ci
          WORKER_IMAGE: watchdog-worker:ci
          SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/watchdog
          SMOKE_S3_ENDPOINT: http://127.0.0.1:9100
        run: bash docker/smoke.sh

  advisory:
    name: Advisory
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        needs.changes.outputs.web == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # React Doctor PR summary + inline review comments
      issues: write # React Doctor sticky comment goes through the issues API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: React Doctor (advisory)
        if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
        uses: millionco/react-doctor@673ce802a375eeb4c3c5cb9a96d21eaeb7eafd93 # v2.3.1
        with:
          blocking: none
          directory: apps/web

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          python-version: "3.11"

      - name: Desloppify scan (advisory, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pip install --quiet "desloppify[full]==1.0"
          bash scripts/desloppify-bootstrap.sh
          desloppify --lang typescript scan --path . --profile ci --no-badge
          desloppify status --json | tee desloppify-status.json

      - name: Upload Desloppify status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desloppify-status
          path: desloppify-status.json
          if-no-files-found: ignore

  # Single required status for branch protection (success | skipped allowed).
  check:
    name: Check
    needs:
      [
        changes,
        gates,
        unit-component,
        gate-tests,
        integration,
        e2e,
        web-build,
        container,
      ]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Aggregate parallel jobs
        run: |
          set -euo pipefail
          fail=0
          # File detection must succeed: a failed or cancelled one leaves every other
          # job skipped, which the loop below would read as a pass.
          echo "changes=${{ needs.changes.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changes finished with ${{ needs.changes.result }}"
            fail=1
          fi
          for pair in \
            "gates:${{ needs.gates.result }}" \
            "unit-component:${{ needs.unit-component.result }}" \
            "gate-tests:${{ needs.gate-tests.result }}" \
            "integration:${{ needs.integration.result }}" \
            "e2e:${{ needs.e2e.result }}" \
            "web-build:${{ needs.web-build.result }}" \
            "container:${{ needs.container.result }}"
          do
            name="${pair%%:*}"
            result="${pair##*:}"
            echo "$name=$result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$name finished with $result"
                fail=1
                ;;
            esac
          done
          exit "$fail"
