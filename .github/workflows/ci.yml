# Watchdog CI — change-aware parallel jobs, fail-fast gates.
# Docs-only PRs skip heavy jobs; push to main always runs full CI.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  BETTER_AUTH_SECRET: test-secret-must-be-at-least-32-chars
  BETTER_AUTH_URL: http://127.0.0.1:3000
  BETTER_AUTH_ALLOW_SIGNUP: "1"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/watchdog
  S3_ENDPOINT: http://127.0.0.1:9100
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: watchdog-evidence
  S3_REGION: us-east-1
  WD_MASTER_VAULT_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

jobs:
  changes:
    name: File detection
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      config: ${{ steps.filter.outputs.config }}
      caps: ${{ steps.filter.outputs.caps }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      db: ${{ steps.filter.outputs.db }}
      e2e: ${{ steps.filter.outputs.e2e }}
      agents: ${{ steps.filter.outputs.agents }}
      docs: ${{ steps.filter.outputs.docs }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.json'
              - '**/*.yml'
              - '**/*.yaml'
              - '**/*.sql'
              - '**/*.sh'
              - '**/*.mjs'
              - '**/*.js'
            typescript:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/tsconfig*.json'
            config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
              - 'knip.ts'
              - 'oxlint.config.ts'
              - 'oxfmt.config.ts'
              - 'tsconfig.json'
              - '.github/**'
              - 'docker-compose.yml'
              - 'scripts/**'
            caps:
              - 'packages/caps/**'
            api:
              - 'packages/api/**'
              - 'packages/client/**'
              - 'packages/core/**'
            web:
              - 'apps/web/**'
            db:
              - 'packages/db/**'
            e2e:
              - 'e2e/**'
              - 'playwright.config.ts'
            agents:
              - '**/AGENTS.md'
              - 'scripts/check-agents.mjs'
              - '**/.agents/skills/**'
              - 'scripts/validate-agents.mjs'
              - '.cursor/README.md'
            docs:
              - 'docs/**'
              - 'docs/reference/web/**'
              - '**/*.md'
              - 'scripts/check-docs.mjs'
              - 'scripts/doc-map.mjs'
              - 'scripts/check-docs-affected.mjs'

  gates:
    name: Gates
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Ultracite (Oxlint + Oxfmt)
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check

      - name: AGENTS.md hygiene
        if: github.event_name != 'pull_request' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:agents:strict

      - name: Docs links and index
        if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:docs:strict

      - name: Docs affect (strict map)
        if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:docs-affected:strict

      - name: Effect run* edges
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm check:effect-edges:strict

      - name: Agent Skills validation
        if: github.event_name != 'pull_request' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm validate:agents

      - name: Typecheck
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm typecheck

      - name: Knip (unused files / exports / deps)
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm knip

      - name: Web DS bans
        if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm --filter @watchdog/web ds:check

      - name: CapDescriptor drift
        if: github.event_name != 'pull_request' || needs.changes.outputs.caps == 'true' || needs.changes.outputs.config == 'true'
        run: |
          pnpm generate:caps
          git diff --exit-code -- packages/caps/capabilities.gen.json \
            || (echo "capabilities.gen.json out of date — run pnpm generate:caps" && exit 1)

      - name: OpenAPI client contract drift
        if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true' || needs.changes.outputs.config == 'true'
        run: |
          pnpm generate:client
          git diff --exit-code -- packages/client/src/generated/ \
            || (echo "client contract out of date — run pnpm generate:client" && exit 1)

      - name: Repo layer contract
        if: github.event_name != 'pull_request' || needs.changes.outputs.db == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm --filter @watchdog/db check:repos

  unit:
    name: Unit
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit + property tests
        if: github.event_name != 'pull_request' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm test:unit && pnpm test:property

      - name: Component tests
        if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.config == 'true'
        run: pnpm test:component

  integration:
    name: Integration + e2e
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.db == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.caps == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: watchdog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watchdog" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Test databases + migrate
        env:
          DATABASE_URL_MIGRATE: postgresql://postgres:postgres@127.0.0.1:5432/watchdog
        run: pnpm test-db

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9100/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO failed to become healthy" >&2
          docker logs minio
          exit 1

      - name: Create evidence bucket
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /tmp/mc
          chmod +x /tmp/mc
          /tmp/mc alias set local http://127.0.0.1:9100 minioadmin minioadmin
          /tmp/mc mb --ignore-existing local/watchdog-evidence

      - name: Integration tests
        if: |
          github.event_name != 'pull_request' ||
          needs.changes.outputs.db == 'true' ||
          needs.changes.outputs.api == 'true' ||
          needs.changes.outputs.caps == 'true' ||
          needs.changes.outputs.typescript == 'true' ||
          needs.changes.outputs.config == 'true'
        env:
          DATABASE_URL: postgresql://watchdog_app:watchdog@127.0.0.1:5432/watchdog_test
          DATABASE_URL_MIGRATE: postgresql://postgres:postgres@127.0.0.1:5432/watchdog_test
        run: pnpm test:integration

      - name: Cache Playwright browsers
        if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.config == 'true'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: |
          (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.config == 'true') &&
          steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: |
          (github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.config == 'true') &&
          steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Playwright e2e
        if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.config == 'true'
        env:
          DATABASE_URL: postgresql://watchdog_app:watchdog@127.0.0.1:5432/watchdog_e2e
          DATABASE_URL_MIGRATE: postgresql://postgres:postgres@127.0.0.1:5432/watchdog_e2e
          CI: "true"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  advisory:
    name: Advisory
    needs: changes
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        needs.changes.outputs.web == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: React Doctor (advisory)
        if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
        uses: millionco/react-doctor@v2
        with:
          blocking: none
          directory: apps/web

      - uses: actions/setup-python@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          python-version: "3.11"

      - name: Desloppify scan (advisory, main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pip install --quiet --upgrade "desloppify[full]"
          bash scripts/desloppify-bootstrap.sh
          desloppify --lang typescript scan --path . --profile ci --no-badge
          desloppify status --json | tee desloppify-status.json

      - name: Upload Desloppify status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: desloppify-status
          path: desloppify-status.json
          if-no-files-found: ignore

  # Single required status for branch protection (success | skipped allowed).
  check:
    name: Check
    needs: [changes, gates, unit, integration]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate parallel jobs
        run: |
          set -euo pipefail
          fail=0
          for pair in \
            "gates:${{ needs.gates.result }}" \
            "unit:${{ needs.unit.result }}" \
            "integration:${{ needs.integration.result }}"
          do
            name="${pair%%:*}"
            result="${pair##*:}"
            echo "$name=$result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$name finished with $result"
                fail=1
                ;;
            esac
          done
          exit "$fail"
