# CLA collection (issue #308). Separate from ci.yml on purpose: it never runs on a push,
# and `Check` does not wait for it. The signature record lives in this repository on the
# `cla-signatures` branch (create it once, unprotected; see docs/contributing/ci-gates.md).
name: cla

on:
  issue_comment:
    types: [created]
  # pull_request_target runs this file from the base branch and gives a fork's PR a token
  # that can write. The job checks out nothing and runs no PR code: the action only reads
  # the PR's commit authors and comments through the API.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Comments on plain issues are ignored; on a PR only the sign phrase and `recheck` count.
    if: |
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    permissions:
      actions: write # re-run the check after a signature
      contents: write # commit signatures to the cla-signatures branch
      pull-requests: write # the explanation comment
      statuses: write # the CLA status on the PR head
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/kzndotsh/watchdog/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          # The owner and every GitHub App account (dependabot, renovate, github-actions and
          # the review bots all end in "[bot]"; that suffix cannot occur in a user login).
          allowlist: kzndotsh,*[bot]
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Watchdog needs a signed contributor license agreement before it can merge outside contributions. Read the [CLA](https://github.com/kzndotsh/watchdog/blob/main/CLA.md) (a license grant: you keep your copyright; it lets the owner also distribute your contribution under other licenses, including commercial ones). An employer signs the [corporate CLA](https://github.com/kzndotsh/watchdog/blob/main/CLA-corporate.md) instead. To sign, post the comment below once; it covers all your future pull requests.
