# Advisory report of mocks, casts, sleeps and assertions a pull request adds or removes in
# test files (scripts/test-diff-report.mjs). It writes to the job summary and never fails:
# the shrink-only lint baselines are the enforcing side (docs/contributing/testing/standards.md).
name: test-mock-report

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Only a pull request supersedes its own earlier run.
concurrency:
  group: test-mock-report-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: Test mock report (advisory)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Advisory: a failure of the report itself never blocks the pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Report test mock movement
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/test-diff-report.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
