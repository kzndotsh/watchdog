# Dependabot version updates — security updates are enabled separately in repo settings.
# pnpm workspace: single npm entry at / (do not list apps/* / packages/*).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      # `@effect/tsgo` patches the exact oxlint binary it supports, so the lint
      # toolchain must bump as one PR (a lone oxlint bump fails `pnpm install`).
      # Listed first: Dependabot assigns a dependency to the first matching group.
      lint-toolchain:
        patterns:
          - "oxlint"
          - "oxlint-*"
          - "@oxlint/*"
          - "@effect/tsgo"
          - "@effect/tsgo-*"
          - "oxfmt"
          - "ultracite"
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
      types:
        patterns:
          - "@types/*"

  # Actions are pinned as `uses: owner/repo@<sha> # vX.Y.Z` (scripts/check-action-pins.mjs);
  # Dependabot bumps the SHA and rewrites the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(docker)"
    # Major Postgres image bumps need volume-path + CI/flake coord — not auto-merge.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(nix)"
